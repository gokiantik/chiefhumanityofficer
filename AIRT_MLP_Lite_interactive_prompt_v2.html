function setLang(l, btn) {

  btn.classList.add('active');

}

function showTab(id) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
  document.getElementById('tab-btn-' + id).classList.add('active');
  document.getElementById('tab-' + id).classList.add('active');
}

function renderTabs() {
  ['about','framework','prompt','howto'].forEach(function(id) {
    document.getElementById('tab-btn-' + id).textContent = i18n.tabs[id][lang];
  });
}

function renderPrompt() {
  var d = i18n.prompt[lang];
  var txt = lang === 'id' ? promptID : promptEN;

function renderAll() {
  renderTabs();
  renderAbout();
  renderFramework();
  renderPrompt();
  renderHowto();
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function copyPrompt() {
  var txt = lang === 'id' ? promptID : promptEN;
  navigator.clipboard.writeText(txt).then(function(){
    var btn = document.getElementById('copyBtn');
    var d = i18n.prompt[lang];
    btn.textContent = d.copied;
    btn.classList.add('copied');
    setTimeout(function(){ btn.textContent = d.btn; btn.classList.remove('copied'); }, 2500);
  });
}

renderAll();
</script>
